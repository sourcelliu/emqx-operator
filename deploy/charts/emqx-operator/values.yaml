# Default values for emqx-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global configuration shared across dependent charts.
global: {}

# Marks this release as the control plane instance that manages cluster-wide
# resources (CRDs, etc). Non-control-plane instances should set this
# to false so they only install namespaced components.
controlPlane: false

# Skip installing CRDs as part of this release. When unset, the chart will
# automatically skip CRDs if controlPlane=false.
skipCRDs: null

## If true, the operator will watch only the namespace where it is deployed. If false, the operator will watch all namespaces.
singleNamespace: true

# Development configures the logger to use a Zap development config
# (stacktraces on warnings, no sampling), otherwise a Zap production
# config will be used (stacktraces on errors, sampling).
development: false

replicaCount: 1

# The number of old history to retain to allow rollback
revisionHistoryLimit: 10

image:
  repository: emqx/emqx-operator-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true

containerSecurityContext:
  allowPrivilegeEscalation: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
